name: Build Sonic Launcher APK
on:
  workflow_dispatch: # Allows you to start the build manually with a click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install cython buildozer kivy pillow

    - name: Compile APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic-Launcher-APK
        path: bin/*.apk
