name: Build Sonic Launcher APK
on:
  workflow_dispatch: # Allows you to start the build manually with a click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install cython buildozer kivy pillow

    - name: Force Generate and Fix Buildozer Spec
      run: |
        # Completely destroy any existing spec file anywhere in the directory
        rm -rf buildozer.spec
        rm -f ./buildozer.spec
        
        # Force a completely clean initialization from scratch
        buildozer init
        
        # Overwrite the settings securely using sed
        sed -i 's/^title =.*/title = Sonic Launcher/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = rsdklauncher/' buildozer.spec
        sed -i 's/^package.domain =.*/package.domain = com.wildcatdev/' buildozer.spec
        sed -i 's/^source.include_exts =.*/source.include_exts = py, png, spec/' buildozer.spec
        sed -i 's|^# icon.filename =.*|icon.filename = %(source.dir)s/launcher_icon.png|' buildozer.spec
        sed -i 's/^# android.permissions =.*/android.permissions = MANAGE_EXTERNAL_STORAGE/' buildozer.spec
        sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
        
        # Inject the core mandatory variables Buildozer demands
        sed -i 's|^source.dir =.*|source.dir = .|' buildozer.spec
        sed -i 's/^version =.*/version = 1.0/' buildozer.spec

    - name: Compile APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE: "y"

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sonic-Launcher-APK
        path: bin/*.apk
